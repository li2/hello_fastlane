# Name of the workflow
name: Android Master & PR CI

# on what event workflow will be triggered:
# pushing commits or pull request to master (main trunk)
on:
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'

# Each workflow can have multiple jobs which by default are running in parallel, but
# it could be changed to have specific sequence of them.
jobs:
  unitTest:
    name: Run Unit Tests
    # instance of a virtual machine jobs runs on.
    runs-on: ubuntu-latest
    steps:
      # allow the workflow to access the content of the repository
      - uses: actions/checkout@v1

      # set up a JDK version
      - name: set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8

      # runs unit tests
      - name: Unit tests
        run: bash ./gradlew test --stacktrace

  apk:
    name: Generate APK
    # only runs build job when unit test pass
    needs: unitTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1

      - name: set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8

      - name: Build APK
        run: ./gradlew assembleUatRelease --stacktrace

      - name: Sign APK
        # https://github.com/marketplace/actions/sign-android-release
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/uat/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v1
        with:
          name: app
          path: ${{ env.SIGNED_RELEASE_FILE }}

      - name: Deploy to Firebase App Distribution
        # https://github.com/marketplace/actions/firebase-app-distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1.2.1
        with:
          appId: ${{secrets.FIREBASE_APP_ID}}
          # $firebase login:ci to get token
          token: ${{secrets.FIREBASE_TOKEN}}
          groups: hello-fastlane-uat-testers
          file: ${{ env.SIGNED_RELEASE_FILE }}