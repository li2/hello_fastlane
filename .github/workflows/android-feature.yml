# Name of the workflow
name: Android Feature Branch CI

# on what event workflow will be triggered:
# pushing commits to a branch other than master (main trunk) or which starts with release in its name
on:
  push:
    branches:
      - '*'
      - '!master'
      - '!release*'

# Each workflow can have multiple jobs which by default are running in parallel, but
# it could be changed to have specific sequence of them.
jobs:
  test:
    name: Run Unit Tests
    # instance of a virtual machine jobs runs on.
    runs-on: ubuntu-latest

    steps:
      # allow the workflow to access the content of the repository
      - uses: actions/checkout@v1
      # set up a JDK version
      - name: set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
      # runs unit tests
      - name: Unit tests
        run: bash ./gradlew test --stacktrace